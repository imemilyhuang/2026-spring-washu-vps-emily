<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invisible Cities — Italo Calvino</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Macondo&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- SCREEN 1 — Splash -->
    <section id="splash" class="screen active">
      <img
        class="splash-illustration"
        src="../../assets/images/project-2/geometric-city-sunset-reflection.png"
        aria-hidden="true"
      />
      <div class="splash-decoration">* * *</div>
      <h1 class="splash-title">INVISIBLE CITIES</h1>
      <p class="splash-author">italo calvino (1972)</p>
      <p class="splash-translation"><em>a digital translation</em></p>
      <button class="splash-enter" id="splashEnter">ENTER →</button>
      <blockquote class="splash-quote">"Arriving at each new city, the traveler finds again a past of his that he did not know he had."</blockquote>
    </section>

    <!-- SCREEN 2 — Chapter Overview -->
    <section id="chapter-overview" class="screen">
      <header class="city-header chapter-overview-header">
        <div class="city-header-inner">
          <button class="city-logo" id="chapterOverviewLogo" aria-label="Back to home" title="Back to home">*</button>
          <div class="chapter-overview-header-center">
            <button class="nav-btn chapter-overview-prev" id="chapterOverviewPrev" aria-label="Previous chapter">◀</button>
            <nav class="breadcrumb" id="chapterOverviewBreadcrumb" aria-label="Breadcrumb"></nav>
            <button class="nav-btn chapter-overview-next" id="chapterOverviewNext" aria-label="Next chapter">▶</button>
          </div>
          <button class="menu-toggle" id="chapterOverviewMenuToggle" aria-label="Open menu">
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
          </button>
        </div>
      </header>
      <div class="chapter-overview-inner">
        <h2 class="chapter-overview-title" id="chapterOverviewTitle"></h2>
        <p class="chapter-overview-desc" id="chapterOverviewDesc"></p>
        <div class="chapter-overview-cities-wrap" id="chapterOverviewCitiesWrap"></div>
        <button class="splash-enter chapter-overview-continue-btn" id="chapterOverviewContinue">CONTINUE TO CITIES →</button>
        <div class="chapter-overview-decoration">* * *</div>
      </div>
    </section>

    <!-- SCREEN 3 — City View -->
    <section id="city-view" class="screen">
      <header class="city-header">
        <div class="city-header-inner">
          <button class="city-logo" id="cityLogo" aria-label="Back to home" title="Back to home">*</button>
          <div class="city-header-center">
            <button class="nav-btn nav-prev" id="navPrev" disabled aria-label="Previous city">◀</button>
            <nav class="breadcrumb" id="cityBreadcrumb" aria-label="Breadcrumb"></nav>
            <button class="nav-btn nav-next" id="navNext" aria-label="Next city">▶</button>
          </div>
          <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
          </button>
        </div>
      </header>
      <main class="city-main">
        <article class="city-content">
          <div class="city-icon-wrap">
            <img class="city-icon" id="cityIcon" src="" alt="" />
          </div>

          <div class="city-title-block">
            <h1 class="city-title" id="cityTitle"></h1>
            <button type="button" class="city-subtitle" id="citySubtitle" aria-label="View other cities in this chapter"></button>
          </div>

          <div class="city-excerpt-wrap">
            <p class="city-excerpt" id="cityExcerpt"></p>
            <!-- <div class="city-bottom-nav">
              <button type="button" class="splash-enter city-bottom-nav-btn" id="cityBottomNavPrev" aria-label="Previous city">◀ PREV</button>
              <button type="button" class="splash-enter city-bottom-nav-btn" id="cityBottomNavNext" aria-label="Next city">NEXT ▶</button>
            </div> -->
            <div class="city-section-divider" aria-hidden="true"><span class="city-section-divider-asterisk">*</span></div>
            <div class="motif-section">
              <p class="motif-label">MOTIFS PRESENT</p>
              <div class="motif-tags" id="motifTags"></div>
            </div>
          </div>
        </article>
      </main>
    </section>

    <!-- SCREEN 4 — Navigation Overlay -->
    <div class="nav-overlay" id="navOverlay" aria-hidden="true">
      <header class="nav-overlay-header">
        <div class="nav-overlay-header-inner">
          <button class="city-logo nav-overlay-logo" id="navOverlayLogo" aria-label="Back to home" title="Back to home">*</button>
          <h2 class="nav-overlay-title" id="navOverlayTitle">Invisible Cities</h2>
          <button class="menu-close" id="menuClose" aria-label="Close menu">
            <span class="menu-close-bar"></span>
            <span class="menu-close-bar"></span>
            <span class="menu-close-bar"></span>
          </button>
        </div>
      </header>
      <nav class="nav-overlay-list" id="navOverlayList"><div class="nav-overlay-list-inner"></div></nav>
    </div>

    <!-- SCREEN 5 — Motif View -->
    <section id="motif-view" class="screen">
      <header class="motif-view-header">
        <button class="motif-view-back" id="motifViewBack" aria-label="Back">◀</button>
        <nav class="breadcrumb motif-view-breadcrumb" id="motifViewBreadcrumb" aria-label="Breadcrumb"></nav>
      </header>
      <div class="motif-cards" id="motifCards"></div>
    </section>

    <!-- SCREEN 6 — Theme View -->
    <section id="theme-view" class="screen">
      <header class="motif-view-header">
        <button class="motif-view-back" id="themeViewBack" aria-label="Back">◀</button>
        <nav class="breadcrumb motif-view-breadcrumb" id="themeViewBreadcrumb" aria-label="Breadcrumb"></nav>
      </header>
      <div class="motif-cards" id="themeCards"></div>
    </section>

    <!-- SCREEN 7 — All Themes -->
    <section id="all-themes-view" class="screen">
      <header class="motif-view-header">
        <button class="motif-view-back" id="allThemesViewBack" aria-label="Back">◀</button>
        <nav class="breadcrumb motif-view-breadcrumb" id="allThemesViewBreadcrumb" aria-label="Breadcrumb"></nav>
      </header>
      <div class="motif-cards" id="allThemesCards"></div>
    </section>

    <!-- SCREEN 8 — All Motifs -->
    <section id="all-motifs-view" class="screen">
      <header class="motif-view-header">
        <button class="motif-view-back" id="allMotifsViewBack" aria-label="Back">◀</button>
        <nav class="breadcrumb motif-view-breadcrumb" id="allMotifsViewBreadcrumb" aria-label="Breadcrumb"></nav>
      </header>
      <div class="motif-cards" id="allMotifsCards"></div>
    </section>

    <!-- SCREEN 9 — All Cities Grid -->
    <section id="all-cities-view" class="screen">
      <header class="motif-view-header">
        <button class="motif-view-back" id="allCitiesViewBack" aria-label="Back">◀</button>
        <h2 class="motif-view-title">All Cities</h2>
      </header>
      <div class="motif-cards" id="allCitiesCards"></div>
    </section>

    <script src="data.js"></script>
    <script src="chapters.js"></script>
    <script src="script.js"></script>
  </body>
</html>
